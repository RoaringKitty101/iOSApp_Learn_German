<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.5" />
  
  <!-- German Flag Ribbon Disc -->
  <g clip-path="url(#circleClip)">
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="170" />
    </clipPath>
    <rect x="86" y="86" width="340" height="113" fill="#18181b" />
    <rect x="86" y="199" width="340" height="113" fill="#dc2626" />
    <rect x="86" y="312" width="340" height="114" fill="#f59e0b" />
  </g>
  
  <!-- Inner Dark Medallion -->
  <circle cx="256" cy="256" r="110" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" />
  
  <!-- D30 Typography Emblem -->
  <text x="256" y="275" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" fill="#fbbf24" text-anchor="middle" letter-spacing="-2">D30</text>
</svg>
